				"fi",
				"",
				"if [ -f \"${GOOGLE_SERVICE_INFO}\" ]; then",
				"    cp \"${GOOGLE_SERVICE_INFO}\" \"${RESOURCES_DIRECTORY}/GoogleService-Info.plist\"",
				"else",
				"    echo \"note: GoogleService-Info.plist is missing, Firebase stays off\"",
