		847F586430B4E35C005D1400 /* Copy Config */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"$(SRCROOT)/fanny-macOS/Config/config.example.json",
			);
			name = "Copy Config";
			outputPaths = (
